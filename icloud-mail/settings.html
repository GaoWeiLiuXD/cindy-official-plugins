<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/settings.css">
</head>
<body>
  <header>
    <div>
      <h1>iCloud Mail 账号</h1>
      <p class="subtle">由 Cindy 安全保存</p>
    </div>
    <span id="stateBadge" class="badge">未连接</span>
  </header>

  <section id="connectedCard" class="connected-card" hidden>
    <div class="account-mark" aria-hidden="true">i</div>
    <div class="account-copy">
      <strong id="connectedEmail"></strong>
      <span>App 专用密码已加密保存在 Cindy 本机</span>
    </div>
    <button id="disconnect" class="secondary compact" type="button">断开</button>
  </section>

  <form id="connectForm">
    <label for="email">iCloud Mail 邮箱地址</label>
    <input id="email" name="email" type="email" inputmode="email"
      autocomplete="username" placeholder="example@icloud.com" maxlength="254">

    <label for="appSpecificPassword">Apple 账户 App 专用密码</label>
    <div class="secret-row">
      <input id="appSpecificPassword" name="appSpecificPassword" type="password"
        autocomplete="current-password" placeholder="xxxx-xxxx-xxxx-xxxx" maxlength="128">
      <button id="toggleSecret" class="secondary compact" type="button"
        aria-label="显示 App 专用密码">显示</button>
    </div>

    <p class="help">
      请确认 Apple 账户已开启双重认证，然后前往
      <a href="https://account.apple.com/" target="_blank" rel="noreferrer">Apple 账户网站</a>，
      在“登录与安全 → App 专用密码”中生成密码。这里不要填写 Apple 账户密码。
    </p>

    <button id="connect" class="primary" type="submit">连接并测试</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>

  <aside>
    App 专用密码不会进入 Agent 参数或插件 main.js，仅在执行邮箱请求时由 Cindy 临时提供
    给插件 Worker。邮件操作使用短连接，完成后会立即断开 IMAP/SMTP。
  </aside>

  <script src="/settings.js"></script>
</body>
</html>

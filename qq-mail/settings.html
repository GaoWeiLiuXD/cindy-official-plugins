<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="/settings.css">
</head>
<body>
  <header>
    <div>
      <h1>QQ 邮箱账号</h1>
      <p class="subtle">由 Cindy 安全保存</p>
    </div>
    <span id="stateBadge" class="badge">未连接</span>
  </header>

  <section id="connectedCard" class="connected-card" hidden>
    <div class="account-mark" aria-hidden="true">Q</div>
    <div class="account-copy">
      <strong id="connectedEmail"></strong>
      <span>授权码已加密保存在 Cindy 本机</span>
    </div>
    <button id="disconnect" class="secondary compact" type="button">断开</button>
  </section>

  <form id="connectForm">
    <label for="email">QQ 邮箱地址</label>
    <input id="email" name="email" type="email" inputmode="email"
      autocomplete="username" placeholder="example@qq.com" maxlength="254">

    <label for="authorizationCode">IMAP/SMTP 授权码</label>
    <div class="secret-row">
      <input id="authorizationCode" name="authorizationCode" type="password"
        autocomplete="current-password" placeholder="通常为 16 位授权码" maxlength="128">
      <button id="toggleSecret" class="secondary compact" type="button" aria-label="显示授权码">显示</button>
    </div>

    <p class="help">
      请先在 QQ 邮箱网页版的“设置 → 账号与安全 → 安全设置”中开启
      IMAP/SMTP，并生成授权码。这里不要填写 QQ 密码。
    </p>

    <button id="connect" class="primary" type="submit">连接并测试</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>

  <aside>
    授权码不会进入 Agent 参数或插件 main.js，仅在执行邮箱请求时由 Cindy 临时提供
    给插件 Worker。邮件操作使用短连接，完成后会立即断开 IMAP/SMTP。
  </aside>

  <script src="/settings.js"></script>
</body>
</html>
